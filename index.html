<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>點擊相片播放音樂</title>
</head>
<body>

<h2>點擊下面相片播放音樂</h2>

<audio id="myAudio">
  <source src="music.mp3" type="audio/mpeg">
  瀏覽器唔支援音樂播放


<!-- 改用 raw 絕對網址，直接讀取GitHub圖片 -->
<img id="myPic" src="https://raw.githubusercontent.com/louis2263/mp3/main/photo.jpg" alt="打卡相片" width="450" style="cursor:pointer;" onerror="document.write('<p>圖片載入失敗</p>')">

<script>
const audio = document.getElementById("myAudio");
const pic = document.getElementById("myPic");

pic.onclick = function() {
  if(audio.paused){
    audio.play();
  }else{
    audio.pause();
  }
}
</script>

</body>
</html>
