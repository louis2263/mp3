<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>點擊相片播放音樂</title>
<style>
  :root {
    --primary-color: #007aff;
    --bg-color: #f5f5f7;
    --card-bg: #ffffff;
    --text-color: #1d1d1f;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background-color: var(--bg-color);
    color: var(--text-color);
    margin: 0;
    padding: 20px;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    box-sizing: border-box;
  }
  .container {
    background: var(--card-bg);
    padding: 24px;
    border-radius: 20px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
    max-width: 450px;
    width: 100%;
    text-align: center;
  }
  h2 {
    margin-top: 0;
    font-size: 1.4rem;
    color: #1d1d1f;
  }
  .version {
    font-size: 0.85rem;
    color: #86868b;
    margin-bottom: 12px;
  }
  .status-box {
    background: #f0f0f2;
    padding: 10px 14px;
    border-radius: 12px;
    font-size: 0.9rem;
    margin-bottom: 18px;
    word-break: break-all;
    transition: all 0.3s ease;
  }
  .speed-wrap{
    margin-bottom:18px;
  }
  .speed-label{
    font-size:0.9rem;
    margin-bottom:6px;
    display:block;
  }
  input[type="range"]{
    width:100%;
  }
  .img-container {
    position: relative;
    width: 100%;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    cursor: pointer;
    background-color: #e5e5ea;
    aspect-ratio: 4/5;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #myPic {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: transform 0.3s ease, opacity 0.3s ease;
  }
  .img-container:active #myPic {
    transform: scale(0.98);
  }
  .play-badge {
    position: absolute;
    bottom: 12px;
    right: 12px;
    background: rgba(0, 0, 0, 0.65);
    backdrop-filter: blur(8px);
    color: white;
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 0.85rem;
    display: flex;
    align-items: center;
    gap: 6px;
    pointer-events: none;
  }
  .pulse-icon {
    width: 8px;
    height: 8px;
    background-color: #34c759;
    border-radius: 50%;
    display: inline-block;
  }
  .playing .pulse-icon {
    animation: pulse 1.2s infinite;
  }
  @keyframes pulse {
    0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(52, 199, 89, 0.7); }
    70% { transform: scale(1); box-shadow: 0 0 0 8px rgba(52, 199, 89, 0); }
    100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(52, 199, 89, 0); }
  }
</style>
</head>
<body>
<div class="container">
  <h2>點擊下面相片播放音樂</h2>
  <div class="version">v1.07｜可調播放速度滑桿</div>
  
  <div id="msg" class="status-box">⏳ 正在初始化...</div>

  <!-- 速度滑桿 -->
  <div class="speed-wrap">
    <span class="speed-label">播放速度：<span id="speedVal">1.00</span> x</span>
    <input id="speedSlider" type="range" min="0.5" max="2.0" step="0.05" value="1.0">
  </div>

  <div class="img-container" id="imgBox">
    <img id="myPic" src="photo.jpg" alt="相片" />
    <div class="play-badge" id="badge">
      <span class="pulse-icon"></span>
      <span id="badgeText">點擊播放</span>
    </div>
  </div>

  <audio id="myAudio" preload="auto">
    <source src="music.mp3" type="audio/mpeg">
    您的瀏覽器不支援音訊播放。
  
</div>

<script>
  const audio = document.getElementById("myAudio");
  const msg = document.getElementById("msg");
  const pic = document.getElementById("myPic");
  const imgBox = document.getElementById("imgBox");
  const badgeText = document.getElementById("badgeText");

  const speedSlider = document.getElementById("speedSlider");
  const speedVal = document.getElementById("speedVal");

  let imgLoaded = false;
  let audioLoaded = false;

  // 滑桿變更 → 更新播放速度
  speedSlider.addEventListener('input', function(){
    const sp = parseFloat(this.value);
    audio.playbackRate = sp;
    speedVal.innerText = sp.toFixed(2);
  });

  function updateStatus() {
    let status = [];
    if (imgLoaded) status.push("✅ 圖片正常");
    else status.push("❌ 圖片失敗(請檢查 photo.jpg)");
    if (audioLoaded) status.push("✅ 音樂正常");
    else status.push("⚠️ 等待音樂載入");
    msg.innerText = status.join(" ｜ ");
  }

  pic.onload = function() {
    imgLoaded = true;
    updateStatus();
  };
  pic.onerror = function() {
    imgLoaded = false;
    if (window.location.protocol === 'file:') {
      msg.innerText = "❌ 圖片失敗：本地開啟(file://)被瀏覽器阻擋，請用 GitHub Pages / Live Server";
    }else{
      updateStatus();
    }
  };

  if (pic.complete && pic.naturalWidth !== 0) {
    imgLoaded = true;
    updateStatus();
  }

  audio.addEventListener('canplay', () => {
    audioLoaded = true;
    updateStatus();
  });

  audio.addEventListener('error', () => {
    audioLoaded = false;
    msg.innerText = "❌ 圖片正常 ｜ ❌ 搵唔到 music.mp3";
  });

  // 播完重置介面
  audio.addEventListener('ended', ()=>{
    imgBox.classList.remove("playing");
    badgeText.innerText = "點擊播放";
    msg.innerText = "⏹️ 音樂播放完畢";
  });

  // 點擊圖片播 / 暫停
  imgBox.onclick = function() {
    if (audio.paused) {
      audio.play().then(() => {
        msg.innerText = "▶️ 播放中，點擊相片暫停";
        badgeText.innerText = "播放中";
        imgBox.classList.add("playing");
      }).catch((err) => {
        msg.innerText = "⚠️ 播放失敗 (請先點擊頁面互動或檢查 music.mp3)";
        console.error("Playback failed:", err);
      });
    } else {
      audio.pause();
      msg.innerText = "⏸️ 已暫停";
      badgeText.innerText = "已暫停";
      imgBox.classList.remove("playing");
    }
  };
</script>
</body>
</html>
